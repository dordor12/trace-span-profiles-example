# =============================================================================
# Trace-Span-Profiles Example
# =============================================================================
# A complete setup for testing span-to-profile correlation with:
# - Pyroscope (continuous profiling)
# - Tempo (distributed tracing)
# - Grafana (visualization)
# - Demo Spring Boot app with OpenTelemetry + Pyroscope agents
#
# See README.md for usage instructions
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Demo Application - Wall Profiling
  # ---------------------------------------------------------------------------
  # Spring Boot app with Wall (clock) profiling
  app-wall:
    build:
      context: ./app
      args:
        OTEL_JAVA_AGENT_VERSION: ${OTEL_JAVA_AGENT_VERSION:-2.12.0}
        PYROSCOPE_AGENT_VERSION: ${PYROSCOPE_AGENT_VERSION:-2.1.2}
        PYROSCOPE_OTEL_VERSION: ${PYROSCOPE_OTEL_VERSION:-1.0.4}
    ports:
      - "8080:8080"
    volumes:
      - ${PYROSCOPE_OTEL_JAR:-/dev/null}:/agents/pyroscope-otel-local.jar:ro
      - ${PYROSCOPE_AGENT_JAR:-/dev/null}:/agents/pyroscope-local.jar:ro
    environment:
      - OTEL_SERVICE_NAME=demo-app-wall
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - PYROSCOPE_APPLICATION_NAME=demo-app-wall
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      - PYROSCOPE_FORMAT=jfr
      - PYROSCOPE_PROFILER_EVENT=wall
      - PYROSCOPE_PROFILING_INTERVAL=${PROFILING_INTERVAL:-10ms}
      - PYROSCOPE_PROFILER_ALLOC=${PROFILING_ALLOC:-10000}
      - PYROSCOPE_UPLOAD_INTERVAL=${UPLOAD_INTERVAL:-10s}
      - PYROSCOPE_LABELS=service_name=demo-app-wall
      - OTEL_PYROSCOPE_ROOT_SPAN_ONLY=${OTEL_PYROSCOPE_ROOT_SPAN_ONLY:-false}
      - OTEL_PYROSCOPE_ADD_SPAN_NAME=${OTEL_PYROSCOPE_ADD_SPAN_NAME:-true}
      - OTEL_PYROSCOPE_CONTEXT_PROPAGATION_ENABLED=${OTEL_PYROSCOPE_CONTEXT_PROPAGATION_ENABLED:-true}
      - USE_LOCAL_PYROSCOPE_OTEL=${PYROSCOPE_OTEL_JAR:+true}
      - USE_LOCAL_PYROSCOPE_AGENT=${PYROSCOPE_AGENT_JAR:+true}
    depends_on:
      - tempo
      - pyroscope
    networks:
      - observability
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Demo Application - CPU Profiling
  # ---------------------------------------------------------------------------
  # Spring Boot app with CPU (itimer) profiling
  app-cpu:
    build:
      context: ./app
      args:
        OTEL_JAVA_AGENT_VERSION: ${OTEL_JAVA_AGENT_VERSION:-2.12.0}
        PYROSCOPE_AGENT_VERSION: ${PYROSCOPE_AGENT_VERSION:-2.1.2}
        PYROSCOPE_OTEL_VERSION: ${PYROSCOPE_OTEL_VERSION:-1.0.4}
    ports:
      - "8081:8080"
    volumes:
      - ${PYROSCOPE_OTEL_JAR:-/dev/null}:/agents/pyroscope-otel-local.jar:ro
      - ${PYROSCOPE_AGENT_JAR:-/dev/null}:/agents/pyroscope-local.jar:ro
    environment:
      - OTEL_SERVICE_NAME=demo-app-cpu
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - PYROSCOPE_APPLICATION_NAME=demo-app-cpu
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      - PYROSCOPE_FORMAT=jfr
      - PYROSCOPE_PROFILER_EVENT=itimer
      - PYROSCOPE_PROFILING_INTERVAL=${PROFILING_INTERVAL:-10ms}
      - PYROSCOPE_PROFILER_ALLOC=${PROFILING_ALLOC:-10000}
      - PYROSCOPE_UPLOAD_INTERVAL=${UPLOAD_INTERVAL:-10s}
      - PYROSCOPE_LABELS=service_name=demo-app-cpu
      - OTEL_PYROSCOPE_ROOT_SPAN_ONLY=${OTEL_PYROSCOPE_ROOT_SPAN_ONLY:-false}
      - OTEL_PYROSCOPE_ADD_SPAN_NAME=${OTEL_PYROSCOPE_ADD_SPAN_NAME:-true}
      - OTEL_PYROSCOPE_CONTEXT_PROPAGATION_ENABLED=${OTEL_PYROSCOPE_CONTEXT_PROPAGATION_ENABLED:-true}
      - USE_LOCAL_PYROSCOPE_OTEL=${PYROSCOPE_OTEL_JAR:+true}
      - USE_LOCAL_PYROSCOPE_AGENT=${PYROSCOPE_AGENT_JAR:+true}
    depends_on:
      - tempo
      - pyroscope
    networks:
      - observability
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Pyroscope - Continuous Profiling
  # ---------------------------------------------------------------------------
  pyroscope:
    image: ${PYROSCOPE_IMAGE:-grafana/pyroscope:latest}
    ports:
      - "4040:4040"
    volumes:
      - pyroscope-data:/var/lib/pyroscope
    networks:
      - observability

  # ---------------------------------------------------------------------------
  # Tempo - Distributed Tracing
  # ---------------------------------------------------------------------------
  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:2.7.0}
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo API
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - observability

  # ---------------------------------------------------------------------------
  # Grafana - Visualization
  # ---------------------------------------------------------------------------
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.3.0}
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=traceToProfiles
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - tempo
      - pyroscope
    networks:
      - observability

  # ---------------------------------------------------------------------------
  # Load Generator
  # ---------------------------------------------------------------------------
  load-generator:
    image: curlimages/curl:latest
    depends_on:
      app-wall:
        condition: service_healthy
      app-cpu:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Starting load generation for both apps..."
        while true; do
          # Wall profiling app
          curl -s http://app-wall:8080/api/users > /dev/null
          curl -s http://app-wall:8080/api/products > /dev/null
          curl -s "http://app-wall:8080/api/products/search?query=laptop" > /dev/null
          curl -s http://app-wall:8080/api/orders > /dev/null
          curl -s "http://app-wall:8080/api/span-test/worker-spans?count=5&durationMs=5" > /dev/null
          # CPU profiling app
          curl -s http://app-cpu:8080/api/users > /dev/null
          curl -s http://app-cpu:8080/api/products > /dev/null
          curl -s "http://app-cpu:8080/api/products/search?query=laptop" > /dev/null
          curl -s http://app-cpu:8080/api/orders > /dev/null
          curl -s "http://app-cpu:8080/api/span-test/worker-spans?count=5&durationMs=5" > /dev/null
          sleep 2
        done
    networks:
      - observability

networks:
  observability:
    driver: bridge

volumes:
  tempo-data:
  pyroscope-data:
  grafana-data:
